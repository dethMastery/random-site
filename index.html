<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomized tool</title>

    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <link
      rel="shortcut icon"
      href="https://suphakit.net/favicon.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="window" style="width: 300px; transform: scale(1.5)">
        <div class="title-bar">
          <div class="title-bar-text">mini random software :3</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <div class="text-container" id="main-container">
            <h3 id="result" style="text-align: center">กดเพิ่มสุ่มเลข</h3>

            <p id="list" style="text-align: center"></p>
          </div>

          <div class="progress hidden" id="main-progress">
            <progress max="100" value="0" id="value-progress"></progress>
          </div>

          <section
            class="field-row"
            style="justify-content: flex-end"
            id="normal-btn-container"
          >
            <button onclick="reset()">รีเซ็ต</button>
            <button onclick="random()">สุ่ม</button>
          </section>

          <section
            class="field-row hidden"
            style="justify-content: flex-end"
            id="loading-btn-container"
          >
            <button disabled>รีเซ็ต</button>
            <button disabled>สุ่ม</button>
          </section>
        </div>
      </div>
    </div>

    <div class="alert hidden">
      <div class="window" style="width: 20rem" id="alert-window">
        <div class="title-bar">
          <div class="title-bar-text" id="alert-title">
            A Window With Stuff In It
          </div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <div id="alert-body">
            <p>There's so much room for activities!</p>
          </div>

          <section
            class="field-row"
            style="justify-content: flex-end"
            id="alert-btn-container"
          >
            <button onclick="close_alert()">ปิด</button>
          </section>
        </div>
      </div>
    </div>

    <!-- animation -->
    <script src="/src/js/animation.js"></script>

    <!-- variable -->
    <script src="/src/js/variable.js"></script>

    <!-- alert -->
    <script src="/src/js/alert.js"></script>

    <!-- main -->

    <script src="/src/js/main.js"></script>
    <script src="/src/js/shortkey.js"></script>
  </body>
</html>
